<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %} · remindme.in</title>
<style>
  :root { color-scheme: light dark; --fg:#1a1a1a; --muted:#595959; --bg:#fff; --line:#e3e3e3; --accent:#2b5fd9; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8e8; --muted:#a0a0a0; --bg:#15161a; --line:#2c2e35; --accent:#7aa2f7; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  main { max-width: 46rem; margin: 0 auto; padding: 3rem 1.25rem 5rem; }
  h1 { font-size: 1.75rem; line-height:1.2; margin:0 0 .25rem; }
  h2 { font-size: 1.1rem; margin: 2.25rem 0 .6rem; }
  .sub { color: var(--muted); margin: 0 0 2rem; }
  table { border-collapse: collapse; width:100%; margin:.5rem 0 1rem; font-size:.95rem; }
  th, td { text-align:left; padding:.5rem .6rem; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color: var(--muted); font-weight:600; }
  code { background: color-mix(in srgb, var(--fg) 8%, transparent); padding:.1rem .3rem; border-radius:3px; font-size:.9em; }
  a { color: var(--accent); }
  .en { margin-top:3.5rem; padding-top:2rem; border-top:1px solid var(--line); }
  footer { margin-top:3rem; color:var(--muted); font-size:.85rem; }
</style>
</head>
<body><main>{% block content %}{% endblock %}
<footer>remindme.in · <a href="/privacy/">Gizlilik</a> · <a href="/data-deletion/">Veri silme</a></footer>
</main></body>
</html>
