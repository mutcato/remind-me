# remindme.nudgewire.com  ->  gunicorn (127.0.0.1:8001)
#
#   sudo cp deploy/nginx-remindme.conf /etc/nginx/sites-available/remindme
#   sudo ln -s /etc/nginx/sites-available/remindme /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d remindme.nudgewire.com     # TLS'i certbot ekler
#
# certbot bu dosyayı kendisi düzenler: 443 server bloğunu ve sertifika
# satırlarını ekler, 80'i yönlendirmeye çevirir. Aşağıdaki hali TLS öncesidir.

server {
    listen 80;
    listen [::]:80;
    server_name remindme.nudgewire.com;

    # Meta webhook teslimatları: küçük gövde, hızlı yanıt beklenir.
    client_max_body_size 1m;

    access_log /var/log/nginx/remindme.access.log;
    error_log  /var/log/nginx/remindme.error.log;

    location /static/ {
        alias /home/pimutlu/apps/remind-me/staticfiles/;
        access_log off;
        expires 7d;
    }

    # Django admin herkese açık bir subdomain'de duruyor. Kendi IP'ni yazıp
    # aşağıdaki iki satırın yorumunu kaldırmak en basit korumadır.
    location /admin/ {
        # allow <senin-ip-adresin>;
        # deny all;
        proxy_pass         http://127.0.0.1:8001;
        include            /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
    }
}
